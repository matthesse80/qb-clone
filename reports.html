<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEC Ledger - Reports</title><link rel="stylesheet" href="assets/app-shell.css"></head>
<body><div class="shell"><aside class="side"><img class="brand-art" src="assets/nec-ledger-logo.jpg" alt="NEC Ledger"><nav class="nav">
<a href="index.html">⌂ &nbsp; Home</a><a href="customers.html">Customers</a><a href="refunds.html">Refunds</a><a href="receivables.html">Receivables</a><a href="checking.html">Banking</a><a class="active" href="reports.html">Reports</a><a href="company.html">Company & Admin</a>
</nav><div class="sidefoot">Records. Refunds. Results.<br><br>Same work.<br>Better tools.<br>Greater impact.</div></aside><main class="page-main">
<div class="app-top"><div><h1>Reports</h1><div class="app-sub">Operational follow-up, refund, receivable, banking and tax-ready views</div></div><div class="app-badge">Sample data mode</div></div>
<div class="card"><div class="tabs"><button class="tab active" data-tab="followups">Follow-Ups & Aging</button><button class="tab" data-tab="refunds">Refund Summary</button><button class="tab" data-tab="receivables">Receivables</button><button class="tab" data-tab="banking">Banking / Tax</button></div>
<div id="panel-followups" class="panel active"></div><div id="panel-refunds" class="panel"></div><div id="panel-receivables" class="panel"></div><div id="panel-banking" class="panel"></div></div>
</main></div>
<script>
const $=id=>document.getElementById(id),RK='necLedgerRefundCasesV1',IK='necLedgerInvoicesV1',PK='necLedgerPaymentsV1',TK='necLedgerCheckingV1';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});
function load(k,d=[]){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function days(d){return d?Math.floor((new Date()-new Date(d+'T00:00:00'))/86400000):0}
function render(){const cases=load(RK),over=cases.filter(c=>c.recordsRequested&&!c.filedDate&&days(c.recordsRequested)>30&&c.status!=='None').sort((a,b)=>a.recordsRequested.localeCompare(b.recordsRequested));
$('panel-followups').innerHTML='<div class="toolbar"><div><h3 style="margin:0">Claim filing exceptions</h3><div class="muted">Flagged when no claim is filed more than 30 days after utility records were requested.</div></div><button onclick="window.print()">Print / Save PDF</button></div>'+(over.length?'<table style="margin-top:14px"><thead><tr><th>Customer</th><th>Refund case</th><th>Utility</th><th>Records requested</th><th>Records received</th><th>Days</th><th>Next action</th></tr></thead><tbody>'+over.map(c=>'<tr><td>'+esc(c.customerName)+'</td><td>'+esc(c.cycleLabel)+'</td><td>'+esc(c.utilityProvider||'—')+'</td><td>'+esc(c.recordsRequested)+'</td><td>'+esc(c.recordsReceived||'Not received')+'</td><td><span class="pill bad">'+days(c.recordsRequested)+'</span></td><td>'+esc(c.nextAction||'File claim')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">No active 30-day claim-filing exceptions.</p>');
let total=cases.reduce((s,c)=>s+Number(c.electricRefund||0)+Number(c.gasRefund||0)+Number(c.otherRefund||0),0),fees=cases.reduce((s,c)=>{let t=Number(c.electricRefund||0)+Number(c.gasRefund||0)+Number(c.otherRefund||0);return s+t*Number(c.feePct||0)/100},0);
$('panel-refunds').innerHTML='<div class="grid-3"><div class="metric"><div class="k">Cases</div><div class="v">'+cases.length+'</div></div><div class="metric"><div class="k">Refund value</div><div class="v">'+money(total)+'</div></div><div class="metric"><div class="k">Projected NEC fees</div><div class="v">'+money(fees)+'</div></div></div>';
const inv=load(IK),pays=load(PK);let issued=inv.reduce((s,x)=>s+Number(x.amount||0),0),paid=pays.reduce((s,x)=>s+Number(x.amount||0),0);
$('panel-receivables').innerHTML='<div class="grid-3"><div class="metric"><div class="k">Invoice total</div><div class="v">'+money(issued)+'</div></div><div class="metric"><div class="k">Payments</div><div class="v">'+money(paid)+'</div></div><div class="metric"><div class="k">Open A/R</div><div class="v">'+money(issued-paid)+'</div></div></div>';
const tx=load(TK);let inc=0,exp=0;tx.forEach(t=>t.type==='deposit'?inc+=Number(t.amount||0):exp+=Number(t.amount||0));$('panel-banking').innerHTML='<div class="grid-3"><div class="metric"><div class="k">Deposits</div><div class="v">'+money(inc)+'</div></div><div class="metric"><div class="k">Expenses / withdrawals</div><div class="v">'+money(exp)+'</div></div><div class="metric"><div class="k">Net</div><div class="v">'+money(inc-exp)+'</div></div></div><p class="muted">Detailed year-end tax exports will build on the Banking ledger categories.</p>'}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('panel-'+t.dataset.tab).classList.add('active')});render();
</script></body></html>
